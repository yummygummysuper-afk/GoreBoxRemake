name: Import GBRemake ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          set -e
          archive="GBRemake-Prototype-0.1.zip"
          test -f "$archive"
          mkdir -p /tmp/gbremake
          unzip -q "$archive" -d /tmp/gbremake
          cp -a /tmp/gbremake/GBRemake-Prototype-0.1/. .
          rm -f .github/workflows/deploy.yml
          rm -f "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import GBRemake Prototype 0.1"
            git push
          fi
